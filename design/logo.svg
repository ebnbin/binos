<!-- 竖线是数字 1，圆环是数字 0，两笔分开，合起来是小写的 b。0 只压住 1 四分之一线宽，1 停在 0 的圆心高度；
     左右边距 9 / 8 用来平衡偏左的重心。圆角和配色由使用的地方决定 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <rect width="36" height="36" fill="#000"/>
  <path d="M11 8V21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="21" r="6" fill="none" stroke="#fff" stroke-width="4"/>
</svg>
